[package]
name = "rgb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.4", features = ["derive"] }
cpal = { version = "0.18", features = ["pipewire", "pulseaudio"] }
enum-primitive-derive = "^0.3"
num-traits = "^0.2"
pixels = "0.17"
serde = { version = "1.0", features = ["derive"] }
spin_sleep_util = "0.1.1"
toml = "1.1"
winit = "0.30"

[profile.windows]
inherits = "release"
strip = true
lto = true
codegen-units = 1
opt-level = 'z'
